# 호스팅은 PORT 환경변수로 쓸 포트를 알려준다(Render는 기본 10000). 그 값이 없으면
# 로컬처럼 8080으로 뜬다. 바인딩 주소는 기본값 0.0.0.0이라 따로 적지 않는다.
server:
  port: ${PORT:8080}

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/ragdb
    username: ${DB_USERNAME:raguser}
    password: ${DB_PASSWORD:ragpass}
    driver-class-name: org.postgresql.Driver

  ai:
    # 스타터가 ollama·openai 둘이라 어느 것을 쓸지 못 박는다. Spring AI의 기본값이
    # openai라서 적지 않으면 로컬이 키도 없는 OpenAI로 기운다. 배포 프로필에서만 openai로 바꾼다.
    model:
      chat: ollama
      embedding: ollama
      # OpenAI 스타터는 chat·embedding 외에 image·audio·moderation까지 자동 설정하고,
      # 그쪽은 위의 chat·embedding 선택으로 꺼지지 않는다. 키가 없으면 기동 중
      # "At least one credential source must be specified"로 죽는다(실제로 겪음).
      # 이 앱은 네 가지를 쓰지 않으니 프로필과 무관하게 전부 끈다.
      image: none
      moderation: none
      audio:
        speech: none
        transcription: none

    ollama:
      base-url: http://localhost:11434
      chat:
        options:
          model: exaone3.5:2.4b
          temperature: 0.2
          # 답변 길이 상한. 300에서는 절차형 답변(7·8번)이 문장 중간에서 끊겼다.
          # 이미지 링크를 걷어내 조각 밀도가 오르면서 답변이 190 → 267~300토큰으로 길어진 탓이다.
          # 상한을 풀어 재보니 296토큰에서 스스로 멈춰 필요 길이가 300 바로 근처였다.
          # 프롬프트 최대 약 1,650토큰 + 400 = 2,050으로 num-ctx 4096에 한참 못 미친다.
          # top-k나 chunk-size를 올리면 이 여유가 줄어드니 같이 봐야 한다. 근거는 dev_docs/7차_개선.md.
          num-predict: 400
          num-ctx: 4096
      embedding:
        options:
          model: bge-m3

    vectorstore:
      pgvector:
        initialize-schema: true
        dimensions: 1024
        index-type: HNSW
        distance-type: COSINE_DISTANCE

logging:
  level:
    org.springframework.ai: INFO

rag:
  docs-path: D:/dev/rag-docs
  # 목록형 질문은 항목이 여러 조각에 흩어져 상위가 넉넉해야 한다. "ID 생성 방식" 질문에서
  # Table Id Generation이 7위(0.563), 세 방식 요약 조각이 8위(0.562)라 5로는 놓친다.
  # 생성 시간이 응답 시간을 좌우하므로 조각을 늘리는 비용은 작다. 근거는 dev_docs/평가_질문.md 5·6번.
  top-k: 8
  # 무관한 질문의 최고 점수(0.447)와 관련 질문 1위의 최저(0.594) 사이 빈 구간의 가운데.
  # 문서를 54개로 넓히자 0.40으로는 날씨 질문이 0.4001로 뚫렸다. 임계값은 코퍼스에 딸린
  # 값이라 문서를 추가할 때마다 무관한 질문을 다시 재야 한다. 근거는 dev_docs/평가_질문.md 6·7차.
  similarity-threshold: 0.50
  chunk-size: 250
  min-chunk-size-chars: 120
  # 답변 문장마다 [1] 같은 인용 번호를 달게 할지. 로컬은 끈다.
  # exaone3.5:2.4b에서는 11번(할루시네이션)이 0/3 그대로라 이득이 없었고, 2번이 3/3 → 2/3으로
  # 한 번 흔들렸다. 규칙이 하나 늘면 작은 모델이 나머지 규칙을 지킬 여력이 준다(2차_개선.md).
  # 배포 프로필도 끈다(2026-10-25). llama-3.3-70b에서는 측정상 이득이 있었지만, 애초에
  # 사용자가 빼 달라고 한 규칙이고 숫자만 든 스트리밍 조각을 양산한다. 근거는
  # application-prod.yml의 같은 값과 project_status.md §3①·§11.
  cite-sources: false