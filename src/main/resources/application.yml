spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/ragdb
    username: ${DB_USERNAME:raguser}
    password: ${DB_PASSWORD:ragpass}
    driver-class-name: org.postgresql.Driver

  ai:
    ollama:
      base-url: http://localhost:11434
      chat:
        options:
          model: exaone3.5:2.4b
          temperature: 0.2
          num-predict: 300
          num-ctx: 4096
      embedding:
        options:
          model: bge-m3

    vectorstore:
      pgvector:
        initialize-schema: true
        dimensions: 1024
        index-type: HNSW
        distance-type: COSINE_DISTANCE

logging:
  level:
    org.springframework.ai: INFO

rag:
  docs-path: D:/dev/rag-docs
  top-k: 3
  similarity-threshold: 0.40
  chunk-size: 250
  min-chunk-size-chars: 120