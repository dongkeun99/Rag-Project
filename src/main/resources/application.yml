spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/ragdb
    username: ${DB_USERNAME:raguser}
    password: ${DB_PASSWORD:ragpass}
    driver-class-name: org.postgresql.Driver

  ai:
    ollama:
      base-url: http://localhost:11434
      chat:
        options:
          model: exaone3.5:2.4b
          temperature: 0.2
          num-predict: 300
          num-ctx: 4096
      embedding:
        options:
          model: bge-m3

    vectorstore:
      pgvector:
        initialize-schema: true
        dimensions: 1024
        index-type: HNSW
        distance-type: COSINE_DISTANCE

logging:
  level:
    org.springframework.ai: INFO

rag:
  docs-path: D:/dev/rag-docs
  # 목록형 질문은 항목이 여러 조각에 흩어져 상위가 넉넉해야 한다. "ID 생성 방식" 질문에서
  # Table Id Generation이 7위(0.563), 세 방식 요약 조각이 8위(0.562)라 5로는 놓친다.
  # 생성 시간이 응답 시간을 좌우하므로 조각을 늘리는 비용은 작다. 근거는 dev_docs/평가_질문.md 5·6번.
  top-k: 8
  similarity-threshold: 0.40
  chunk-size: 250
  min-chunk-size-chars: 120