<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>문서 질의</title>
    <style>
        :root {
            --bg: #EDEDE8;
            --surface: #FFFFFF;
            --ink: #1A1D1A;
            --muted: #6B6F6A;
            --rule: #D3D5CC;
            --signal: #2F5D50;
            --signal-soft: #C9D6D0;
            --alert: #A33A2A;
            --radius: 3px;
        }

        * { box-sizing: border-box; }

        html { -webkit-text-size-adjust: 100%; }

        body {
            margin: 0;
            background: var(--bg);
            color: var(--ink);
            font-family: system-ui, "Segoe UI", "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
            font-size: 16px;
            line-height: 1.6;
            font-variant-numeric: tabular-nums;
        }

        .wrap {
            max-width: 47rem;
            margin: 0 auto;
            padding: 2.5rem 2.25rem 5rem;
        }

        /* ---------- 머리말 ---------- */
        header {
            display: flex;
            flex-wrap: wrap;
            align-items: baseline;
            justify-content: space-between;
            gap: .5rem 1rem;
            padding-bottom: .75rem;
            border-bottom: 1px solid var(--ink);
        }

        h1 {
            margin: 0;
            font-size: 1.375rem;
            font-weight: 600;
            letter-spacing: -.01em;
        }

        #corpus {
            margin: 0;
            font-size: .875rem;
            color: var(--muted);
        }

        /* ---------- 질문 ---------- */
        form {
            display: flex;
            gap: .625rem;
            align-items: flex-end;
            margin: 1.75rem 0 0;
        }

        /* 질문하기 옆 보조 버튼. 주 동작이 아니므로 테두리만 남긴다. */
        #reset {
            background: transparent;
            border-color: var(--rule);
            color: var(--ink);
            font-weight: 500;
        }

        #reset:hover:not(:disabled) { background: var(--surface); }

        #answer-time {
            margin-left: .125rem;
            color: var(--muted);
            font-weight: 500;
        }

        textarea {
            flex: 1;
            min-height: 3.25rem;
            padding: .75rem .875rem;
            border: 1px solid var(--rule);
            border-radius: var(--radius);
            background: var(--surface);
            color: inherit;
            font: inherit;
            font-size: 1.0625rem;
            line-height: 1.5;
            resize: vertical;
        }

        textarea:focus-visible,
        button:focus-visible,
        .cite:focus-visible,
        summary:focus-visible {
            outline: 2px solid var(--signal);
            outline-offset: 2px;
        }

        button {
            flex: none;
            padding: .8125rem 1.25rem;
            border: 1px solid var(--signal);
            border-radius: var(--radius);
            background: var(--signal);
            color: #fff;
            font: inherit;
            font-weight: 600;
            cursor: pointer;
        }

        button:hover:not(:disabled) { background: #26493F; }

        button:disabled {
            background: var(--muted);
            border-color: var(--muted);
            cursor: default;
        }

        /* ---------- 상태 ---------- */
        #status {
            margin: 1rem 0 0;
            font-size: .9375rem;
            color: var(--muted);
            min-height: 1.5rem;
        }

        #status.error { color: var(--alert); }

        /* ---------- 답변 ---------- */
        .block { margin-top: 2rem; }

        .block[hidden] { display: none; }

        h2 {
            margin: 0;
            font-size: .9375rem;
            font-weight: 600;
            color: var(--muted);
        }

        .block > h2 { margin-bottom: .75rem; }

        /* 근거 목록이 길어 아래로 내려가도 이전·다음을 계속 누를 수 있게 위에 붙여 둔다. */
        .sources-head {
            position: sticky;
            top: 0;
            z-index: 5;
            display: flex;
            flex-wrap: wrap;
            align-items: baseline;
            justify-content: space-between;
            gap: .5rem 1rem;
            margin: 0 -1rem;
            padding: .625rem 1rem;
            background: var(--bg);
        }

        .nav {
            display: flex;
            align-items: center;
            gap: .375rem;
        }

        .nav button {
            padding: .3125rem .6875rem;
            background: transparent;
            border-color: var(--rule);
            color: var(--ink);
            font-size: .8125rem;
            font-weight: 500;
        }

        .nav button:hover:not(:disabled) { background: var(--surface); }

        .nav button:disabled {
            background: transparent;
            border-color: var(--rule);
            color: #A8ABA4;
        }

        #counter,
        #detail-counter {
            min-width: 3rem;
            text-align: center;
            color: var(--muted);
            font-size: .8125rem;
        }

        #threshold-note {
            margin: .5rem 0 .25rem;
            color: var(--muted);
            font-size: .8125rem;
        }

        #answer {
            padding: 1.25rem 1.375rem;
            background: var(--surface);
            border-left: 3px solid var(--signal);
            border-radius: 0 var(--radius) var(--radius) 0;
            font-size: 1.0625rem;
            line-height: 1.75;
            white-space: pre-wrap;
        }

        #answer.notfound { border-left-color: var(--alert); }

        .cite {
            padding: 0 .1875rem;
            border: 0;
            border-radius: 2px;
            background: var(--signal-soft);
            color: var(--signal);
            font: inherit;
            font-weight: 600;
            font-size: .875em;
            cursor: pointer;
        }

        .cite:hover { background: var(--signal); color: #fff; }

        /* ---------- 근거 ---------- */
        #sources {
            margin: 0;
            padding: 0;
            list-style: none;
        }

        #sources li {
            margin: 0 -1rem;
            padding: 1rem 1rem 1.125rem;
            border-top: 1px solid var(--rule);
        }

        #sources li:last-child { border-bottom: 1px solid var(--rule); }

        #sources li.active { background: #FAFAF6; box-shadow: inset 3px 0 0 var(--signal); }

        #sources li:hover { background: #FAFAF7; cursor: pointer; }

        .meta {
            display: flex;
            align-items: baseline;
            gap: .625rem;
            font-size: .9375rem;
        }

        .num {
            flex: none;
            width: 1.375rem;
            color: var(--muted);
            font-weight: 600;
        }

        .file {
            flex: 1;
            min-width: 0;
            overflow-wrap: break-word;
            font-weight: 600;
        }

        .score { flex: none; font-weight: 600; }

        .hint { flex: none; color: var(--muted); font-size: .8125rem; }

        /* ---------- 근거 전문 모달 ---------- */
        /* 목록의 발췌는 200자에서 잘리므로, 잘리지 않은 원문은 여기서 본다. */
        /* 크기를 고정한다. max-height 로 두면 근거 길이마다 모달이 커졌다 작아져
           제각각으로 보인다. 넘치는 내용은 본문에서 스크롤한다.
           스크롤은 본문 한 곳에서만 나게 한다. dialog 자신도 스크롤하면 스크롤바가
           두 개로 보인다. 머리말 높이를 빼는 계산 대신 flex 로 남은 높이를 넘긴다. */
        #detail {
            width: min(42rem, calc(100vw - 2rem));
            height: min(80vh, 44rem);
            padding: 0;
            overflow: hidden;
            border: 1px solid var(--rule);
            border-radius: var(--radius);
            background: var(--surface);
            color: var(--ink);
        }

        /* display 는 [open] 에만 준다. #detail 에 직접 주면 닫힌 모달이 보인다. */
        #detail[open] {
            display: flex;
            flex-direction: column;
        }

        #detail::backdrop { background: rgba(26, 29, 26, .45); }

        .detail-head {
            flex: none;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 1rem;
            padding: 1rem 1.375rem;
            border-bottom: 1px solid var(--rule);
        }

        #detail-title {
            flex: 1;
            min-width: 0;
            overflow-wrap: anywhere;
            color: var(--ink);
        }

        /* 글자 하나짜리 이전·다음 버튼. 폭을 정해두지 않으면 너무 좁아진다. */
        .nav button.step {
            min-width: 2rem;
            padding: .3125rem .375rem;
            font-size: 1rem;
            line-height: 1.25;
        }

        #detail-close {
            padding: .3125rem .6875rem;
            background: transparent;
            border-color: var(--rule);
            color: var(--ink);
            font-size: .8125rem;
            font-weight: 500;
        }

        #detail-close:hover:not(:disabled) { background: var(--bg); }

        #detail-text {
            flex: 1;
            min-height: 0;
            margin: 0;
            padding: 1.25rem 1.375rem;
            overflow-y: auto;
            font-family: inherit;
            font-size: .9375rem;
            line-height: 1.75;
            white-space: pre-wrap;
            overflow-wrap: anywhere;
        }

        /* 점수 막대 — 이 화면의 핵심. 기준선 대비 여유를 보여준다. */
        .gauge {
            position: relative;
            height: 5px;
            margin: .75rem 0 .875rem 2rem;
            background: #E2E4DC;
            border-radius: 999px;
        }

        .gauge .fill {
            height: 100%;
            background: var(--signal);
            border-radius: 999px;
        }

        .gauge .mark {
            position: absolute;
            top: -4px;
            bottom: -4px;
            width: 1px;
            background: var(--ink);
        }

        .excerpt {
            margin: 0 0 0 2rem;
            color: #40453F;
            font-size: .9375rem;
            line-height: 1.7;
        }

        /* ---------- 문서 관리 ---------- */
        details {
            margin-top: 3rem;
            padding-top: 1rem;
            border-top: 1px solid var(--rule);
            font-size: .9375rem;
        }

        summary { cursor: pointer; color: var(--muted); }

        #files {
            margin: 1rem 0;
            padding: 0;
            list-style: none;
            color: var(--muted);
        }

        #files li {
            display: flex;
            justify-content: space-between;
            gap: 1rem;
            padding: .25rem 0;
        }

        /* 문서가 늘면 목록만으로 페이지가 길어지므로 10개씩 끊어 본다. */
        #files-nav { margin: 0 0 1rem; }

        /* .nav 의 display:flex 가 [hidden] 을 이기므로 따로 숨긴다. */
        #files-nav[hidden] { display: none; }

        .tools { display: flex; flex-wrap: wrap; gap: .5rem; }

        .tools button {
            padding: .5rem .875rem;
            background: transparent;
            border-color: var(--rule);
            color: var(--ink);
            font-weight: 500;
            font-size: .875rem;
        }

        .tools button:hover:not(:disabled) { background: var(--surface); }

        #ingest-result {
            margin: .75rem 0 0;
            color: var(--muted);
            font-size: .875rem;
            white-space: pre-wrap;
        }

        /* ---------- 맨 위로 ---------- */
        /* 근거 8건에 전문까지 붙어 페이지가 길다. 한 화면 넘게 내려가면 띄운다.
           모달이 열리면 top layer 에 가려지므로 따로 숨길 필요가 없다. */
        #to-top {
            position: fixed;
            right: 1.5rem;
            bottom: 1.5rem;
            z-index: 10;
            padding: .625rem .875rem;
            border: 1px solid var(--rule);
            border-radius: var(--radius);
            background: var(--surface);
            color: var(--ink);
            font-size: .75rem;
            font-weight: 600;
            letter-spacing: .04em;
            box-shadow: 0 1px 4px rgba(26, 29, 26, .18);
        }

        #to-top:hover:not(:disabled) { background: var(--bg); }

        #to-top[hidden] { display: none; }

        @media (max-width: 34rem) {
            .wrap { padding-top: 1.75rem; }
            form { flex-direction: column; align-items: stretch; }
            #to-top { right: 1rem; bottom: 1rem; }
        }

        @media (prefers-reduced-motion: reduce) {
            * { transition: none !important; }
        }
    </style>
</head>
<body>
<div class="wrap">

    <header>
        <h1>문서 질의</h1>
        <p id="corpus">문서 정보를 불러오는 중</p>
    </header>

    <form id="ask-form">
    <textarea id="question" rows="2"
              placeholder="적재한 문서에 대해 물어보세요. 예) 실행환경의 다섯 가지 서비스 그룹이 뭔가요?"></textarea>
        <button type="submit" id="submit">질문하기</button>
        <button type="button" id="reset">초기화</button>
    </form>

    <p id="status"></p>

    <section class="block" id="answer-block" hidden>
        <h2>답변<span id="answer-time"></span></h2>
        <div id="answer"></div>
    </section>

    <section class="block" id="sources-block" hidden>
        <div class="sources-head">
            <h2 id="sources-title">근거</h2>
            <div class="nav">
                <button type="button" id="prev">이전</button>
                <span id="counter">0 / 0</span>
                <button type="button" id="next">다음</button>
            </div>
        </div>
        <p id="threshold-note"></p>
        <ol id="sources"></ol>
    </section>

    <dialog id="detail">
        <div class="detail-head">
            <h2 id="detail-title">근거</h2>
            <div class="nav">
                <button type="button" class="step" id="detail-prev" aria-label="이전 근거">‹</button>
                <span id="detail-counter">0 / 0</span>
                <button type="button" class="step" id="detail-next" aria-label="다음 근거">›</button>
                <button type="button" id="detail-close">닫기</button>
            </div>
        </div>
        <pre id="detail-text"></pre>
    </dialog>

    <details id="manage">
        <summary>적재된 문서</summary>
        <ul id="files"></ul>
        <div class="nav" id="files-nav" hidden>
            <button type="button" id="files-prev">이전</button>
            <span id="files-counter">0 / 0</span>
            <button type="button" id="files-next">다음</button>
        </div>
        <div class="tools">
            <button type="button" id="reload">새 문서 읽기</button>
            <button type="button" id="reload-force">전체 다시 읽기</button>
        </div>
        <p id="ingest-result"></p>
    </details>

</div>

<button type="button" id="to-top" hidden aria-label="맨 위로">TOP</button>

<script>
    (function () {
        "use strict";

        var els = {
            corpus: document.getElementById("corpus"),
            form: document.getElementById("ask-form"),
            question: document.getElementById("question"),
            submit: document.getElementById("submit"),
            status: document.getElementById("status"),
            answerBlock: document.getElementById("answer-block"),
            answer: document.getElementById("answer"),
            sourcesBlock: document.getElementById("sources-block"),
            sourcesTitle: document.getElementById("sources-title"),
            thresholdNote: document.getElementById("threshold-note"),
            sources: document.getElementById("sources"),
            prev: document.getElementById("prev"),
            next: document.getElementById("next"),
            counter: document.getElementById("counter"),
            files: document.getElementById("files"),
            filesNav: document.getElementById("files-nav"),
            filesPrev: document.getElementById("files-prev"),
            filesNext: document.getElementById("files-next"),
            filesCounter: document.getElementById("files-counter"),
            reload: document.getElementById("reload"),
            reloadForce: document.getElementById("reload-force"),
            ingestResult: document.getElementById("ingest-result"),
            detail: document.getElementById("detail"),
            detailTitle: document.getElementById("detail-title"),
            detailText: document.getElementById("detail-text"),
            detailPrev: document.getElementById("detail-prev"),
            detailNext: document.getElementById("detail-next"),
            detailCounter: document.getElementById("detail-counter"),
            detailClose: document.getElementById("detail-close"),
            reset: document.getElementById("reset"),
            toTop: document.getElementById("to-top"),
            answerTime: document.getElementById("answer-time")
        };

        // 근거 번호 -> 근거 전체. 모달에서 전문을 보여줄 때 쓴다.
        var sourceDetails = {};

        // 질문을 보낸 시각. 답변 제목 옆에 걸린 시간을 적는 데 쓴다.
        var askBegan = 0;

        // 서버가 알려주는 값. 응답이 없으면 막대의 기준선만 생략한다.
        var config = { topK: null, similarityThreshold: null };
        var timer = null;
        var busy = false;
        var activeIndex = 0;
        var sourceCount = 0;

        // 적재된 문서 목록. 한 번 받아 두고 페이지 단위로만 다시 그린다.
        var FILES_PER_PAGE = 10;
        var corpusFiles = [];
        var corpusPage = 1;

        function escapeHtml(text) {
            return String(text)
                .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
        }

        function api(path, options) {
            return fetch(path, options).then(function (res) {
                if (!res.ok) {
                    throw new Error("서버가 " + res.status + " 로 응답했습니다");
                }
                return res.json();
            });
        }

        function post(path, body) {
            return api(path, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(body)
            });
        }

        function setStatus(message, isError) {
            els.status.textContent = message || "";
            els.status.className = isError ? "error" : "";
        }

        function startTimer() {
            stopTimer();
            var tick = function () {
                var seconds = elapsedSeconds();
                setStatus("답변을 만들고 있습니다 (" + seconds + "초)");
            };
            tick();
            timer = setInterval(tick, 1000);
        }

        /** 질문을 보낸 뒤 흐른 초. 화면의 경과 표시와 답변 시간이 같은 값을 쓴다. */
        function elapsedSeconds() {
            return askBegan ? Math.round((Date.now() - askBegan) / 1000) : 0;
        }

        function stopTimer() {
            if (timer) { clearInterval(timer); timer = null; }
        }

        /** 답변 안의 [1] 표기를 근거 항목으로 이동하는 버튼으로 바꾼다. */
        function renderAnswer(text) {
            var notFound = text.indexOf("찾을 수 없습니다") !== -1;
            els.answer.className = notFound ? "notfound" : "";
            els.answer.innerHTML = escapeHtml(text.trim()).replace(
                /\[(\d+)\]/g,
                '<button type="button" class="cite" data-index="$1">[$1]</button>'
            );
        }

        function renderSources(list) {
            els.sources.innerHTML = "";
            els.sourcesTitle.textContent = "근거 " + list.length + "건";
            sourceDetails = {};

            list.forEach(function (item) {
                var score = typeof item.score === "number" ? item.score : 0;
                var li = document.createElement("li");
                li.dataset.index = String(item.index);
                sourceDetails[item.index] = item;

                var gauge = '<div class="gauge"><div class="fill" style="width:' +
                    Math.max(0, Math.min(100, score * 100)).toFixed(1) + '%"></div>';
                if (typeof config.similarityThreshold === "number") {
                    gauge += '<div class="mark" style="left:' +
                        (config.similarityThreshold * 100).toFixed(1) + '%"></div>';
                }
                gauge += "</div>";

                li.innerHTML =
                    '<div class="meta">' +
                    '<span class="num">' + item.index + '</span>' +
                    '<span class="file">' + escapeHtml(item.source) + '</span>' +
                    '<span class="score">' + score.toFixed(3) + '</span>' +
                    '<span class="hint">전문 보기</span>' +
                    '</div>' +
                    gauge +
                    '<p class="excerpt">' + escapeHtml(item.excerpt || "") + '</p>';

                els.sources.appendChild(li);
            });

            sourceCount = list.length;
            els.thresholdNote.textContent = typeof config.similarityThreshold === "number"
                ? "점수 " + config.similarityThreshold.toFixed(2) + " 이상만 표시합니다. 막대 위 세로선이 그 위치입니다."
                : "";
            els.sourcesBlock.hidden = false;
            goTo(1, false);
        }

        /** 근거 하나를 선택 상태로 만든다. scroll 이 false 면 화면을 움직이지 않는다. */
        function goTo(index, scroll) {
            index = Number(index);
            if (!sourceCount || index < 1 || index > sourceCount) { return; }
            activeIndex = index;

            var items = els.sources.querySelectorAll("li");
            for (var i = 0; i < items.length; i++) {
                var match = items[i].dataset.index === String(index);
                items[i].classList.toggle("active", match);
                if (match && scroll !== false && items[i].scrollIntoView) {
                    items[i].scrollIntoView({ block: "center", behavior: "smooth" });
                }
            }
            updateNav();
        }

        /** 근거 이동 버튼은 목록 위와 모달 안 두 곳에 있다. 상태를 한곳에서 맞춘다. */
        function updateNav() {
            var label = sourceCount ? activeIndex + " / " + sourceCount : "0 / 0";
            var atFirst = activeIndex <= 1;
            var atLast = activeIndex >= sourceCount;
            els.counter.textContent = label;
            els.prev.disabled = atFirst;
            els.next.disabled = atLast;
            els.detailCounter.textContent = label;
            els.detailPrev.disabled = atFirst;
            els.detailNext.disabled = atLast;
        }

        /**
         * 모달 본문을 근거 하나로 채운다. 목록의 발췌는 200자에서 잘리므로 전문은 여기서 본다.
         * 본문은 textContent 로 넣어 HTML 이 실행되지 않게 한다(XSS 방지).
         */
        function fillDetail(index) {
            var item = sourceDetails[index];
            if (!item) { return false; }
            var score = typeof item.score === "number" ? item.score.toFixed(3) : "-";
            els.detailTitle.textContent = "[" + item.index + "] " + item.source + " · " + score;
            els.detailText.textContent = item.text || item.excerpt || "";
            els.detailText.scrollTop = 0;   // 앞 근거를 읽던 위치가 남지 않게 한다
            return true;
        }

        /**
         * 모달이 떠 있는 동안 뒤 페이지가 움직이지 않게 막는다. 스크롤 주체는 html 이므로
         * body 에 걸면 뷰포트가 잠기지 않는다. 스크롤바가 사라지면 폭이 넓어져 가운데
         * 정렬이 옆으로 튀므로 사라진 폭만큼 padding 으로 메운다.
         */
        function lockBackground() {
            var root = document.documentElement;
            var gap = window.innerWidth - root.clientWidth;
            root.style.overflow = "hidden";
            root.style.paddingRight = gap > 0 ? gap + "px" : "";
        }

        function unlockBackground() {
            document.documentElement.style.overflow = "";
            document.documentElement.style.paddingRight = "";
        }

        function openDetail(index) {
            if (!els.detail.showModal || !fillDetail(index)) { return; }
            lockBackground();
            els.detail.showModal();
        }

        /**
         * 모달을 닫지 않고 앞뒤 근거로 옮긴다. 선택만 옮기고 목록은 스크롤하지 않는다.
         * 모달 뒤에서 목록이 움직이면 눈에 거슬린다. 위치는 닫을 때 맞춘다.
         */
        function stepDetail(step) {
            var next = activeIndex + step;
            if (next < 1 || next > sourceCount) { return; }
            goTo(next, false);
            fillDetail(next);
        }

        /**
         * 적재된 문서 목록에서 현재 페이지만 그린다. 문서가 늘면 목록이 화면을 다
         * 차지하므로 FILES_PER_PAGE 개씩 끊는다. 목록은 서버가 파일명순으로 준다.
         */
        function renderFiles() {
            var total = corpusFiles.length;
            var pages = Math.max(1, Math.ceil(total / FILES_PER_PAGE));
            corpusPage = Math.min(Math.max(corpusPage, 1), pages);

            var from = (corpusPage - 1) * FILES_PER_PAGE;
            var page = corpusFiles.slice(from, from + FILES_PER_PAGE);

            els.files.innerHTML = "";
            page.forEach(function (f) {
                var li = document.createElement("li");
                li.innerHTML = '<span>' + escapeHtml(f.fileName) + '</span>' +
                    '<span>' + f.chunkCount + '조각</span>';
                els.files.appendChild(li);
            });

            // 한 페이지에 다 들어가면 이동 버튼을 숨긴다.
            els.filesNav.hidden = total <= FILES_PER_PAGE;
            els.filesCounter.textContent = total
                ? (from + 1) + "\u2013" + (from + page.length) + " / " + total
                : "0 / 0";
            els.filesPrev.disabled = corpusPage <= 1;
            els.filesNext.disabled = corpusPage >= pages;
        }

        function loadCorpus() {
            return api("/api/ingested").then(function (files) {
                // DB 콜레이션이 한글 접두어를 건너뛰고 파일명 속 영문으로 정렬해 영역이
                // 섞인다. 10개씩 넘겨 보려면 순서를 예측할 수 있어야 해서 여기서 맞춘다.
                corpusFiles = (files || []).slice().sort(function (a, b) {
                    return String(a.fileName).localeCompare(String(b.fileName), "ko");
                });
                if (!corpusFiles.length) {
                    corpusPage = 1;
                    els.corpus.textContent = "적재된 문서가 없습니다";
                    els.files.innerHTML = '<li>아래 버튼으로 문서를 읽어오세요.</li>';
                    els.filesNav.hidden = true;
                    return;
                }
                var chunks = corpusFiles.reduce(function (sum, f) { return sum + f.chunkCount; }, 0);
                els.corpus.textContent = "문서 " + corpusFiles.length + "개, 조각 " + chunks + "개";
                // 적재 뒤에도 보고 있던 페이지를 유지한다. 범위를 넘으면 renderFiles 가 줄인다.
                renderFiles();
            });
        }

        function loadConfig() {
            return api("/api/config").then(function (data) {
                config = data;
            });
        }

        function ask(question) {
            busy = true;
            askBegan = Date.now();
            els.submit.disabled = true;
            els.answerTime.textContent = "";
            els.answerBlock.hidden = true;
            els.sourcesBlock.hidden = true;
            sourceCount = 0;
            activeIndex = 0;
            updateNav();
            setStatus("문서를 찾고 있습니다");

            // 1단계: 검색만 먼저. 빠르게 끝나므로 근거를 먼저 보여준다.
            post("/api/search", { question: question })
                .then(function (sources) {
                    if (!sources.length) {
                        // 조각이 없으면 답은 정해져 있다. LLM을 부르지 않아 수십 초를 아낀다.
                        renderAnswer("문서에서 찾을 수 없습니다.");
                        els.answerTime.textContent = "(" + elapsedSeconds() + "초)";
                        els.answerBlock.hidden = false;
                        setStatus("기준 점수를 넘는 문서 조각이 없습니다. 질문을 바꾸거나 문서를 더 넣어보세요.");
                        return null;
                    }
                    renderSources(sources);
                    startTimer();
                    // 2단계: 답변 생성. CPU 추론이면 수십 초가 걸린다.
                    return post("/api/ask", { question: question });
                })
                .then(function (result) {
                    stopTimer();
                    if (!result) { return; }
                    renderAnswer(result.answer);
                    els.answerTime.textContent = "(" + elapsedSeconds() + "초)";
                    if (result.sources && result.sources.length) {
                        renderSources(result.sources);
                    }
                    els.answerBlock.hidden = false;
                    setStatus("");
                })
                .catch(function (err) {
                    stopTimer();
                    setStatus(err.message || "요청이 실패했습니다. 앱이 실행 중인지 확인하세요.", true);
                })
                .then(function () {
                    busy = false;
                    els.submit.disabled = false;
                });
        }

        function runIngest(force) {
            els.reload.disabled = true;
            els.reloadForce.disabled = true;
            els.ingestResult.textContent = force
                ? "모든 문서를 다시 읽고 있습니다. 조각마다 임베딩을 계산하므로 오래 걸립니다."
                : "새 문서를 찾고 있습니다.";

            api("/api/ingest?force=" + (force ? "true" : "false"), { method: "POST" })
                .then(function (results) {
                    if (!results.length) {
                        els.ingestResult.textContent = "폴더에 읽을 문서가 없습니다.";
                        return loadCorpus();
                    }
                    els.ingestResult.textContent = results.map(function (r) {
                        return r.fileName + " — " + r.status + " (" + r.chunkCount + "조각)";
                    }).join("\n");
                    return loadCorpus();
                })
                .catch(function (err) {
                    els.ingestResult.textContent = err.message || "문서를 읽지 못했습니다.";
                })
                .then(function () {
                    els.reload.disabled = false;
                    els.reloadForce.disabled = false;
                });
        }

        els.form.addEventListener("submit", function (event) {
            event.preventDefault();
            var question = els.question.value.trim();
            if (!question || busy) { return; }
            ask(question);
        });

        // Enter 로 보낸다. 줄바꿈은 Shift+Enter, Ctrl+Enter 도 그대로 보낸다.
        // 한글 입력 중(IME 조합 중)의 Enter 는 글자를 확정하는 키다. 이때 보내면
        // "안녕하세"처럼 조합이 끝나지 않은 질문이 나가므로 걸러낸다.
        els.question.addEventListener("keydown", function (event) {
            if (event.key !== "Enter" || event.shiftKey) { return; }
            if (event.isComposing || event.keyCode === 229) { return; }
            event.preventDefault();
            els.form.dispatchEvent(new Event("submit", { cancelable: true }));
        });

        els.answer.addEventListener("click", function (event) {
            var target = event.target;
            if (target && target.classList && target.classList.contains("cite")) {
                goTo(target.dataset.index, true);
            }
        });

        els.sources.addEventListener("click", function (event) {
            var li = event.target && event.target.closest ? event.target.closest("li") : null;
            if (!li || !li.dataset.index) { return; }
            goTo(li.dataset.index, false);
            openDetail(li.dataset.index);
        });

        els.detailClose.addEventListener("click", function () { els.detail.close(); });
        els.detailPrev.addEventListener("click", function () { stepDetail(-1); });
        els.detailNext.addEventListener("click", function () { stepDetail(1); });

        // 모달에서 ← → 로도 근거를 넘긴다. 닫기(Esc)는 dialog 가 알아서 처리한다.
        els.detail.addEventListener("keydown", function (event) {
            if (event.key === "ArrowLeft") { event.preventDefault(); stepDetail(-1); }
            if (event.key === "ArrowRight") { event.preventDefault(); stepDetail(1); }
        });

        // 바깥 어두운 영역을 누르면 닫는다. 그때 클릭 대상이 dialog 자신이 된다.
        els.detail.addEventListener("click", function (event) {
            if (event.target === els.detail) { els.detail.close(); }
        });

        // dialog 의 close 이벤트가 환경에 따라 오지 않아(닫히는데 이벤트가 없음) 열림
        // 상태를 직접 지켜본다. 닫기 버튼·바깥 클릭·Esc 어느 경로로 닫혀도 여기로 모인다.
        // 모달 안에서 근거를 옮겼을 수 있으므로 잠금을 풀면서 선택된 근거를 화면에 들인다.
        new MutationObserver(function () {
            if (els.detail.open) { return; }
            unlockBackground();
            goTo(activeIndex, true);
        }).observe(els.detail, { attributes: true, attributeFilter: ["open"] });

        els.prev.addEventListener("click", function () { goTo(activeIndex - 1, true); });
        els.next.addEventListener("click", function () { goTo(activeIndex + 1, true); });

        els.reset.addEventListener("click", function () {
            els.question.value = "";
            els.question.focus();
        });

        els.reload.addEventListener("click", function () { runIngest(false); });
        els.reloadForce.addEventListener("click", function () { runIngest(true); });

        els.filesPrev.addEventListener("click", function () { corpusPage -= 1; renderFiles(); });
        els.filesNext.addEventListener("click", function () { corpusPage += 1; renderFiles(); });

        // 한 화면의 60%를 넘게 내려가면 "맨 위로"를 띄운다.
        function updateToTop() {
            els.toTop.hidden = window.scrollY < window.innerHeight * 0.6;
        }

        window.addEventListener("scroll", updateToTop, { passive: true });
        window.addEventListener("resize", updateToTop);
        els.toTop.addEventListener("click", function () {
            window.scrollTo({ top: 0, behavior: "smooth" });
        });
        updateToTop();

        loadConfig().catch(function () { /* 기준선만 생략하고 계속 진행 */ });
        loadCorpus().catch(function () {
            els.corpus.textContent = "서버에 연결하지 못했습니다";
        });
    })();
</script>
</body>
</html>
