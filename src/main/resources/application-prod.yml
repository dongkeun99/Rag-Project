# 배포 프로필. SPRING_PROFILES_ACTIVE=prod 로 켠다.
#
# 로컬 프로필(application.yml)은 Ollama 그대로 둔다. 측정 보고서의 비교선이
# exaone3.5:2.4b라서, 로컬을 갈아치우면 dev_docs/측정_원자료의 이전 라운드와 비교할 수 없다.
# 여기서 바꾸는 것은 세 가지뿐이다 — 모델 제공처, DB 위치, 문서 위치.
#
# 비밀값은 전부 환경변수로 받는다. 기본값을 두지 않아 빠뜨리면 기동이 바로 실패한다.
# 조용히 잘못된 곳에 붙는 것보다 낫다.
spring:
  # 프로젝트 루트의 .env를 properties로 읽어 들인다. 플러그인도 의존성도 필요 없다.
  # .env의 "KEY=값" 형식이 .properties와 같아서 [.properties]만 붙이면 된다.
  #
  # optional: 이라 파일이 없어도 기동한다. 호스팅에는 .env를 올리지 않고 대시보드의
  # 환경변수를 쓰는데, OS 환경변수가 이 파일보다 우선순위가 높아 그대로 덮인다.
  # 즉 로컬은 .env, 배포는 환경변수로 같은 설정 파일이 돈다.
  config:
    import: optional:file:./.env[.properties]

  # CloudflareEmbeddingModel이 쓰는 RestClient의 제한 시간. Spring Boot는 기본값을 두지
  # 않아서 안 걸면 무한정 기다린다 — 제공처가 멈추면 요청 스레드가 그대로 묶인다.
  # 임베딩은 50건 배치가 0.7초였으므로 읽기 30초면 한참 넉넉하다. 로컬 프로필은 Ollama를
  # Spring AI 자체 클라이언트로 부르므로 이 값의 영향을 받지 않는다.
  http:
    client:
      connect-timeout: 10s
      read-timeout: 30s

  datasource:
    # Supabase 연결 문자열. sslmode=require가 필요하다.
    # 호스트는 세션 풀러를 쓴다. 직접 연결(db.<ref>.supabase.co)은 AAAA 레코드만 있어
    # IPv4 환경에서 붙지 않고, 트랜잭션 풀러(6543)는 prepared statement를 못 써서
    # Hikari/JdbcTemplate에 맞지 않는다. 세션 풀러는 5432, IPv4, prepared statement 지원.
    # 예: jdbc:postgresql://aws-1-ap-southeast-1.pooler.supabase.com:5432/postgres?sslmode=require
    # 이때 username은 postgres가 아니라 postgres.<project-ref>다.
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      # 무료 티어는 동시 접속 수가 빡빡하다. 질문이 한 번에 하나씩 오는 개인용이라 작게 둔다.
      maximum-pool-size: 3
      minimum-idle: 1

  ai:
    # 로컬은 ollama, 배포는 openai. 스타터가 둘 다 올라와 있어 이 값으로 고른다.
    # image·moderation·audio는 application.yml에서 이미 none이다.
    model:
      chat: openai
      # 임베딩은 Spring AI가 아니라 CloudflareEmbeddingModel이 맡는다. 그래서 none이다.
      # 이유는 그 클래스의 주석에 있다 — Cloudflare 임베딩 응답에 usage가 없어서
      # 공식 OpenAI SDK가 `usage` is not set으로 죽는다. 채팅 응답에는 usage가 있다.
      embedding: none

    openai:
      # 답변과 임베딩을 모두 Cloudflare Workers AI에서 받는다. 하루 10,000 뉴런이 무료이고
      # 둘이 그 한도를 같이 쓴다. OpenAI 호환 엔드포인트라 base-url만 바꿔 쓴다.
      #
      # **OpenRouter에서 옮겨 왔다.** 무료 모델이 하루 50건으로 묶이고(측정으로 확인),
      # 그와 별개로 공용 풀 혼잡 때문에 `temporarily rate-limited upstream` 429가 잦았다.
      # 실제로 gemma-4-31b가 3회 연속 429로 막혀 대체 모델로 넘어가는 것을 봤다.
      # Cloudflare는 전용 할당이라 혼잡이 없고, 제공처가 하나라 키도 base-url도 하나다.
      #
      # 계정 ID가 경로에 들어간다. base-url에 /v1까지 적는다 — Spring AI 2.0은 공식
      # OpenAI Java SDK를 쓰고 기본값이 https://api.openai.com/v1 로 /v1을 포함한다.
      base-url: ${rag.cloudflare.base-url}
      api-key: ${rag.cloudflare.api-token}
      chat:
        options:
          # 10번(틀린 전제 교정)과 11번(배치처리 할루시네이션)이 모델 교체의 지표다.
          # exaone3.5:2.4b가 둘 다 0/3이었다. 근거는 project_status.md §3·§6.
          #
          # 후보 넷을 실제로 찔러 보고 골랐다. 11번에서 갈렸다 —
          # llama-3.3-70b만 "문서에서 찾을 수 없습니다"로 답했고(정답),
          # mistral-small-3.1-24b는 지어냈다. 6번(목록 나열)은 둘 다 맞혔다.
          # qwen3-30b와 gemma-4-26b는 추론형이라 탈락이다 — max-tokens 400을 내부 사고에
          # 쓰고 본문이 비거나 한 줄만 나왔다. **추론형 모델은 쓰지 않는다.**
          #
          # 10번은 넷 다 통과하지 못했다. 이 값은 잠정이고, 최종 선택은 evalReport
          # 라운드의 숫자로 정한다(§3④).
          #
          # 비용은 질문 1건에 약 32~97뉴런이라 하루 100건 이상 된다. 측정 한 라운드가
          # 33콜(11문제 × 3회, 9번은 0조각이라 LLM을 안 탄다)이므로 여유가 있다.
          model: "@cf/meta/llama-3.3-70b-instruct-fp8-fast"
          temperature: 0.2
          # 로컬의 num-predict 400과 같은 뜻. 300에서는 절차형 답변(7·8번)이 끊겼다.
          # 근거는 dev_docs/7차_개선.md §5.
          max-tokens: 400
      # embedding 블록은 없다. spring.ai.model.embedding=none이고
      # CloudflareEmbeddingModel이 rag.cloudflare.* 를 받아 직접 호출한다.

    vectorstore:
      pgvector:
        # 스키마와 819청크를 미리 넣어 두므로 앱이 만들지 않는다. Supabase는 확장이
        # extensions 스키마에 있어 Spring AI의 DDL이 그대로 통하지 않을 수 있다.
        initialize-schema: false
        dimensions: 1024
        index-type: HNSW
        distance-type: COSINE_DISTANCE

rag:
  # Cloudflare Workers AI. 답변(Spring AI가 OpenAI 호환으로 호출)과 임베딩
  # (CloudflareEmbeddingModel이 직접 호출)이 이 값을 같이 쓴다.
  # base-url 경로에 계정 ID가 들어가고, /v1까지 적는다.
  cloudflare:
    base-url: https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}/ai/v1
    api-token: ${CF_API_TOKEN}
    # 로컬 Ollama와 같은 모델이라 1024차원과 적재된 819청크를 그대로 쓴다.
    # 저장된 벡터와의 코사인이 최저 0.99988이라 재적재 없이 간다(§7).
    # 바꾸면 벡터 공간이 달라져 전체 재적재 + 임계값 재측정이 필요하다.
    # @ 로 시작하는 값은 YAML이 예약 문자로 보므로 반드시 따옴표로 감싼다.
    embedding-model: "@cf/baai/bge-m3"

  # 문서를 jar 안에서 읽는다. 배포 환경에는 D:/dev/rag-docs가 없다.
  # 접두가 없으면 파일시스템으로 해석되므로 classpath: 를 반드시 적는다.
  docs-path: classpath:docs
  # top-k·similarity-threshold·chunk-size는 application.yml 값을 그대로 쓴다.
  # 임계값은 코퍼스와 임베딩에 딸린 값이라, 둘이 안 바뀌었으면 건드릴 이유가 없다.

logging:
  level:
    org.springframework.ai: INFO
