plugins {
	id 'java'
	id 'org.springframework.boot' version '4.1.1'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.example'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(25)
	}
}

repositories {
	mavenCentral()
}

ext {
	set('springAiVersion', "2.0.1")
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-data-jdbc'
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	implementation 'org.springframework.ai:spring-ai-starter-model-ollama'
	implementation 'org.springframework.ai:spring-ai-starter-vector-store-pgvector'
	implementation 'org.springframework.ai:spring-ai-vector-store-advisor'
	implementation 'org.springframework.ai:spring-ai-tika-document-reader'
	testImplementation 'org.springframework.boot:spring-boot-starter-data-jdbc-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

dependencyManagement {
	imports {
		mavenBom "org.springframework.ai:spring-ai-bom:${springAiVersion}"
	}
}

tasks.named('test') {
	useJUnitPlatform {
		// 평가 측정은 떠 있는 앱과 Ollama가 필요하고 수십 분 걸린다. 일반 테스트에서는 뺀다.
		excludeTags 'eval'
	}
}

// 평가 질문 세트 측정. 떠 있는 앱을 때려 dev_docs/측정_원자료에 보고서를 쓴다.
// 예: ./gradlew evalReport -Prounds=3 -Plabel=인용강제 -Ponly=2,11
tasks.register('evalReport', Test) {
	group = 'verification'
	description = '평가 질문을 회차만큼 측정해 dev_docs/측정_원자료에 보고서를 남긴다'
	testClassesDirs = sourceSets.test.output.classesDirs
	classpath = sourceSets.test.runtimeClasspath
	useJUnitPlatform {
		includeTags 'eval'
	}
	// 측정값은 매번 달라지므로 캐시된 결과를 재사용하면 안 된다.
	outputs.upToDateWhen { false }
	testLogging {
		showStandardStreams = true
	}
	// 한글 보고서와 진행 로그가 깨지지 않게 포크된 JVM의 인코딩을 고정한다.
	jvmArgs '-Dfile.encoding=UTF-8', '-Dstdout.encoding=UTF-8', '-Dstderr.encoding=UTF-8'
	systemProperty 'eval.rounds', findProperty('rounds') ?: '3'
	systemProperty 'eval.only', findProperty('only') ?: ''
	systemProperty 'eval.label', findProperty('label') ?: ''
	systemProperty 'eval.baseUrl', findProperty('baseUrl') ?: 'http://localhost:8080'
}
