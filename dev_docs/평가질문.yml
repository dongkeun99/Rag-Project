# 평가 질문 세트 — 측정 하네스(EvalReportTest)가 읽는 원본이다.
#
# 사람이 읽는 설명·기대 답변·유형별 의도는 dev_docs/평가_질문.md에 있고, 이 파일은 같은
# 세트를 기계가 돌릴 수 있게 옮긴 것이다. 질문을 바꾸면 두 파일을 함께 고친다.
#
# 키워드   답변에 모두 들어 있어야 통과 후보(AND, 대소문자 무시).
# 금지어   하나라도 들어 있으면 사람이 봐야 할 후보. 알려진 실패 모드를 자동으로 잡으려고 둔다.
#          맞는 답에도 걸릴 수 있으므로(2번의 Spring Security처럼 대조로 언급할 수 있다)
#          실패로 단정하지 않고 보고서에 표시만 한다.
# 근거문서 검색 결과에서 몇 위에 들어왔는지 기록한다. 검색이 틀렸는지 모델이 틀렸는지 가른다.
# 기대조각수 이 값이 있으면 검색 조각 수가 같아야 통과다. 9번은 0건이어야 LLM을 타지 않는다.
#
# 자동 판정은 1차 기준일 뿐이다. 의미 판정은 보고서의 "답변 전문"을 사람이 보고 확정한다.
# 3회 중 몇 번 맞았는지로 적고, 1회 성공을 해결로 적지 않는다(4차 교훈).

코퍼스: "가이드 54개 / 838청크 (2026-09-26 적재)"

# 상위 몇 건을 이 문서가 차지했는지 세어 기록한다. 개요.md 독점을 추적하는 지표다.
